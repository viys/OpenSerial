name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm install

      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.31.0 --locked

      - name: Build release artifacts
        run: dist build --artifacts=local --installer=msi --target=x86_64-pc-windows-msvc --allow-dirty
        working-directory: src-tauri
