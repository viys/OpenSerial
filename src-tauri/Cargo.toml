[package]
name = "openserial"
version = "0.1.0"
description = "OpenSerial desktop shell"
authors = ["OpenSerial contributors"]
repository = "https://github.com/viys/OpenSerial"
edition = "2021"

[lib]
name = "openserial_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
